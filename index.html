<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TD7 - AR.js image tracking</title>

<!-- A-Frame puis AR.js (image tracking / NFT) -->
<script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1c2407b26c61958baa93967b5412487cd94b290b/dist/aframe-master.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

<style>
  .arjs-loader {
    height: 100%;
    width: 100%;
    position: absolute;
    top: 0;
    left: 0;
    background-color: rgba(0, 0, 0, 0.8);
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .arjs-loader div {
    text-align: center;
    font-size: 1.25em;
    color: white;
  }
  /* bandeau d'état : permet de voir ce qui se passe sur le téléphone */
  #status {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: 10px;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    font-family: sans-serif;
    font-size: 16px;
    text-align: center;
    z-index: 10000;
  }
  /* zone de diagnostic : messages d'erreur lisibles sur le téléphone */
  #debug {
    position: fixed;
    top: 52px;
    left: 0;
    right: 0;
    max-height: 40vh;
    overflow: auto;
    margin: 0;
    padding: 6px 10px;
    background: rgba(0, 0, 0, 0.65);
    color: #7CFC7C;
    font-family: monospace;
    font-size: 11px;
    white-space: pre-wrap;
    z-index: 10000;
  }
</style>
</head>

<body style="margin: 0px; overflow: hidden;">

  <div id="status">Chargement… autorise la caméra</div>
  <pre id="debug"></pre>

  <div class="arjs-loader">
    <div>Loading, please wait...</div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >

    <a-assets>
      <!-- les 6 images du GIF "Animation de la fresque LIBERTÀ" (A-Frame ne sait pas animer un GIF) -->
      <img id="f0" src="assets/gif/frame0.jpg" crossorigin="anonymous">
      <img id="f1" src="assets/gif/frame1.jpg" crossorigin="anonymous">
      <img id="f2" src="assets/gif/frame2.jpg" crossorigin="anonymous">
      <img id="f3" src="assets/gif/frame3.jpg" crossorigin="anonymous">
      <img id="f4" src="assets/gif/frame4.jpg" crossorigin="anonymous">
      <img id="f5" src="assets/gif/frame5.jpg" crossorigin="anonymous">
    </a-assets>

    <!-- l'image qui sert de déclencheur : descripteurs assets/a.iset, a.fset, a.fset3 -->
    <a-nft
      id="marker"
      type="nft"
      url="https://clemshoot.github.io/td7-image/assets/a"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <!-- le GIF est posé à plat, centré sur l'image scannée -->
      <!-- position/taille de départ ; elles sont recalculées avec la vraie taille de l'image dès qu'elle est chargée -->
      <a-entity id="content" position="361.2 270.9 0">
        <a-image
          id="clip"
          src="#f0"
          width="361.2"
          height="358.9"
          position="0 0 3"
          material="shader: flat; side: double"
        ></a-image>
      </a-entity>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    var statusEl = document.getElementById('status');
    var dbg = document.getElementById('debug');
    function log(m) { dbg.textContent += m + "\n"; }

    // chronomètre pendant le chargement
    var t0 = Date.now(), loaded = false;
    var timer = setInterval(function () {
      if (loaded) { clearInterval(timer); return; }
      statusEl.textContent = "Chargement… " + Math.round((Date.now() - t0) / 1000) + " s";
    }, 1000);

    // vérifie que GitHub Pages sert bien les 3 fichiers de la photo
    ['iset', 'fset', 'fset3'].forEach(function (ext) {
      fetch('assets/a.' + ext).then(function (r) {
        return r.arrayBuffer().then(function (b) {
          log('a.' + ext + ' : HTTP ' + r.status + ' (' + Math.round(b.byteLength / 1024) + ' Ko)');
        });
      }).catch(function (e) { log('a.' + ext + ' : ERREUR ' + e); });
    });

    // affiche les erreurs dans la zone de diagnostic
    var _log = console.log, _err = console.error;
    console.log = function () {
      var m = Array.prototype.slice.call(arguments).join(' ');
      if (/error|erreur|fail/i.test(m)) log('LOG: ' + m.slice(0, 200));
      _log.apply(console, arguments);
    };
    console.error = function () {
      log('ERR: ' + Array.prototype.slice.call(arguments).join(' ').slice(0, 200));
      _err.apply(console, arguments);
    };
    window.addEventListener('error', function (e) { log('ERR: ' + e.message); });
    window.addEventListener('unhandledrejection', function (e) {
      log('PROMISE: ' + ((e.reason && e.reason.message) || e.reason));
    });
    var loader = document.querySelector('.arjs-loader');
    var marker = document.getElementById('marker');

    // les descripteurs de l'image sont chargés
    window.addEventListener('arjs-nft-loaded', function () {
      loaded = true;
      log('arjs-nft-loaded OK après ' + Math.round((Date.now() - t0) / 1000) + ' s');
      if (loader) loader.style.display = 'none';
      statusEl.textContent = "Pointe la caméra vers la photo";
    });

    // taille réelle de l'image scannée (en mm) -> on centre et on ajuste la vidéo
    var VIDEO_RATIO = 508 / 505; // largeur / hauteur du GIF
    window.addEventListener('arjs-nft-init-data', function (e) {
      var d = e.detail;                       // { dpi, width, height } (pixels)
      var wMM = d.width / d.dpi * 25.4;       // largeur de l'image scannée en unités AR.js (mm)
      var hMM = d.height / d.dpi * 25.4;
      // la vidéo tient entièrement dans l'image (sans déformation)
      var vw = wMM, vh = wMM / VIDEO_RATIO;
      if (vh > hMM) { vh = hMM; vw = hMM * VIDEO_RATIO; }
      document.getElementById('content').setAttribute('position', (wMM / 2) + ' ' + (hMM / 2) + ' 0');
      var clip = document.getElementById('clip');
      clip.setAttribute('width', vw);
      clip.setAttribute('height', vh);
      log('image : ' + Math.round(wMM) + ' x ' + Math.round(hMM) + ' mm (dpi ' + d.dpi + ')');
    });

    // animation du GIF : on fait défiler les 6 images (180 ms chacune, comme le GIF d'origine)
    var clipEl = document.getElementById('clip');
    var NB_FRAMES = 6, FRAME_MS = 180, frame = 0, gifTimer = null;
    function startGif() {
      if (gifTimer) return;
      gifTimer = setInterval(function () {
        frame = (frame + 1) % NB_FRAMES;
        clipEl.setAttribute('material', 'src', '#f' + frame);
      }, FRAME_MS);
    }
    function stopGif() {
      clearInterval(gifTimer);
      gifTimer = null;
    }

    // l'image est reconnue / perdue : on lance / on arrête le GIF
    marker.addEventListener('markerFound', function () {
      if (loader) loader.style.display = 'none';
      statusEl.textContent = "Image détectée ✓";
      startGif();
    });
    marker.addEventListener('markerLost', function () {
      statusEl.textContent = "Pointe la caméra vers la photo";
      stopGif();
    });
  </script>
</body>
</html>
