<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TD7 - AR.js image tracking</title>

<!-- A-Frame puis AR.js (image tracking / NFT) -->
<script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1c2407b26c61958baa93967b5412487cd94b290b/dist/aframe-master.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

<script>
  // Anti-tremblement : l'entité suit la position de l'image détectée avec un filtre.
  // - petits mouvements (bruit du tracking) -> suivi très lent, le GIF reste quasi immobile
  // - grands mouvements (on bouge vraiment le téléphone) -> suivi rapide
  // - si l'image est perdue un court instant, le GIF reste affiché au lieu de clignoter
  AFRAME.registerComponent('smooth-follow', {
    schema: {
      target: { type: 'selector' },
      minAlpha: { default: 0.03 },  // vitesse de suivi quand ça tremble juste un peu
      maxAlpha: { default: 0.5 },   // vitesse de suivi pour un vrai déplacement
      posRange: { default: 40 },    // mm : au-delà, on considère que c'est un vrai déplacement
      rotRange: { default: 0.15 },  // radians (~9°) : idem pour la rotation
      lostDelay: { default: 600 }   // ms pendant lesquels on garde le GIF après une perte
    },
    init: function () {
      this.tPos = new THREE.Vector3();
      this.tQuat = new THREE.Quaternion();
      this.tScale = new THREE.Vector3();
      this.hasPose = false;
      this.lastSeen = 0;
      this.el.object3D.visible = false;
    },
    tick: function (time) {
      var target = this.data.target;
      if (!target) return;
      var o = this.el.object3D;
      var m = target.object3D;

      if (!m.visible) {
        // image perdue : on garde le GIF un petit moment, puis on le cache
        if (time - this.lastSeen > this.data.lostDelay) {
          o.visible = false;
          this.hasPose = false;
        }
        return;
      }

      this.lastSeen = time;
      m.updateMatrixWorld(true);
      m.matrixWorld.decompose(this.tPos, this.tQuat, this.tScale);

      if (!this.hasPose) {
        // première détection : on se place directement sur l'image
        o.position.copy(this.tPos);
        o.quaternion.copy(this.tQuat);
        o.scale.copy(this.tScale);
        this.hasPose = true;
      } else {
        var d = this.data;
        // plus l'écart est grand, plus on suit vite (filtre adaptatif)
        var aPos = THREE.MathUtils.clamp(o.position.distanceTo(this.tPos) / d.posRange, 0, 1);
        var aRot = THREE.MathUtils.clamp(o.quaternion.angleTo(this.tQuat) / d.rotRange, 0, 1);
        var alpha = d.minAlpha + (d.maxAlpha - d.minAlpha) * Math.max(aPos, aRot) * Math.max(aPos, aRot);
        o.position.lerp(this.tPos, alpha);
        o.quaternion.slerp(this.tQuat, alpha);
        o.scale.lerp(this.tScale, alpha);
      }
      o.visible = true;
    }
  });
</script>

<style>
  .arjs-loader {
    height: 100%;
    width: 100%;
    position: absolute;
    top: 0;
    left: 0;
    background-color: rgba(0, 0, 0, 0.8);
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .arjs-loader div {
    text-align: center;
    font-size: 1.25em;
    color: white;
  }
  /* bandeau d'état : permet de voir ce qui se passe sur le téléphone */
  #status {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: 10px;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    font-family: sans-serif;
    font-size: 16px;
    text-align: center;
    z-index: 10000;
  }
  /* zone de diagnostic : messages d'erreur lisibles sur le téléphone */
  #debug {
    position: fixed;
    top: 52px;
    left: 0;
    right: 0;
    max-height: 40vh;
    overflow: auto;
    margin: 0;
    padding: 6px 10px;
    background: rgba(0, 0, 0, 0.65);
    color: #7CFC7C;
    font-family: monospace;
    font-size: 11px;
    white-space: pre-wrap;
    z-index: 10000;
  }
</style>
</head>

<body style="margin: 0px; overflow: hidden;">

  <div id="status">Chargement… autorise la caméra</div>
  <pre id="debug"></pre>

  <div class="arjs-loader">
    <div>Loading, please wait...</div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >

    <a-assets>
      <!-- les 6 images du GIF "Animation de la fresque LIBERTÀ" (A-Frame ne sait pas animer un GIF) -->
      <img id="f0" src="assets/gif/frame0.jpg" crossorigin="anonymous">
      <img id="f1" src="assets/gif/frame1.jpg" crossorigin="anonymous">
      <img id="f2" src="assets/gif/frame2.jpg" crossorigin="anonymous">
      <img id="f3" src="assets/gif/frame3.jpg" crossorigin="anonymous">
      <img id="f4" src="assets/gif/frame4.jpg" crossorigin="anonymous">
      <img id="f5" src="assets/gif/frame5.jpg" crossorigin="anonymous">
    </a-assets>

    <!-- l'image qui sert de déclencheur : descripteurs assets/a.iset, a.fset, a.fset3 -->
    <a-nft
      id="marker"
      type="nft"
      url="https://clemshoot.github.io/td7-image/assets/a"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    ></a-nft>

    <!-- le GIF n'est pas accroché directement à l'image : il la suit en douceur (anti-tremblement) -->
    <a-entity id="anchor" smooth-follow="target: #marker">
      <!-- le GIF est posé à plat, centré sur l'image scannée -->
      <!-- position/taille de départ ; elles sont recalculées avec la vraie taille de l'image dès qu'elle est chargée -->
      <!-- repère AR.js NFT : origine = coin bas-gauche de l'image, X vers la droite, -Z vers le haut de l'image, Y sort de l'image -->
      <a-entity id="content" position="361.2 0 -270.9">
        <a-image
          id="clip"
          src="#f0"
          width="361.2"
          height="358.9"
          position="0 1 0"
          rotation="-90 0 0"
          material="shader: flat; side: double"
        ></a-image>
      </a-entity>
    </a-entity>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    var statusEl = document.getElementById('status');
    var dbg = document.getElementById('debug');
    function log(m) { dbg.textContent += m + "\n"; }

    // chronomètre pendant le chargement
    var t0 = Date.now(), loaded = false;
    var timer = setInterval(function () {
      if (loaded) { clearInterval(timer); return; }
      statusEl.textContent = "Chargement… " + Math.round((Date.now() - t0) / 1000) + " s";
    }, 1000);

    // vérifie que GitHub Pages sert bien les 3 fichiers de la photo
    ['iset', 'fset', 'fset3'].forEach(function (ext) {
      fetch('assets/a.' + ext).then(function (r) {
        return r.arrayBuffer().then(function (b) {
          log('a.' + ext + ' : HTTP ' + r.status + ' (' + Math.round(b.byteLength / 1024) + ' Ko)');
        });
      }).catch(function (e) { log('a.' + ext + ' : ERREUR ' + e); });
    });

    // affiche les erreurs dans la zone de diagnostic
    var _log = console.log, _err = console.error;
    console.log = function () {
      var m = Array.prototype.slice.call(arguments).join(' ');
      if (/error|erreur|fail/i.test(m)) log('LOG: ' + m.slice(0, 200));
      _log.apply(console, arguments);
    };
    console.error = function () {
      log('ERR: ' + Array.prototype.slice.call(arguments).join(' ').slice(0, 200));
      _err.apply(console, arguments);
    };
    window.addEventListener('error', function (e) { log('ERR: ' + e.message); });
    window.addEventListener('unhandledrejection', function (e) {
      log('PROMISE: ' + ((e.reason && e.reason.message) || e.reason));
    });
    var loader = document.querySelector('.arjs-loader');
    var marker = document.getElementById('marker');

    // les descripteurs de l'image sont chargés
    window.addEventListener('arjs-nft-loaded', function () {
      loaded = true;
      log('arjs-nft-loaded OK après ' + Math.round((Date.now() - t0) / 1000) + ' s');
      if (loader) loader.style.display = 'none';
      statusEl.textContent = "Pointe la caméra vers la photo";
    });

    // taille réelle de l'image scannée (en mm) -> on centre et on ajuste la vidéo
    var VIDEO_RATIO = 508 / 505; // largeur / hauteur du GIF
    window.addEventListener('arjs-nft-init-data', function (e) {
      var d = e.detail;                       // { dpi, width, height } (pixels)
      var wMM = d.width / d.dpi * 25.4;       // largeur de l'image scannée en unités AR.js (mm)
      var hMM = d.height / d.dpi * 25.4;
      // la vidéo tient entièrement dans l'image (sans déformation)
      var vw = wMM, vh = wMM / VIDEO_RATIO;
      if (vh > hMM) { vh = hMM; vw = hMM * VIDEO_RATIO; }
      document.getElementById('content').setAttribute('position', (wMM / 2) + ' 0 ' + (-hMM / 2));
      var clip = document.getElementById('clip');
      clip.setAttribute('width', vw);
      clip.setAttribute('height', vh);
      log('image : ' + Math.round(wMM) + ' x ' + Math.round(hMM) + ' mm (dpi ' + d.dpi + ')');
    });

    // animation du GIF : on fait défiler les 6 images (180 ms chacune, comme le GIF d'origine)
    var clipEl = document.getElementById('clip');
    var NB_FRAMES = 6, FRAME_MS = 180, frame = 0, gifTimer = null;
    function startGif() {
      if (gifTimer) return;
      gifTimer = setInterval(function () {
        frame = (frame + 1) % NB_FRAMES;
        clipEl.setAttribute('material', 'src', '#f' + frame);
      }, FRAME_MS);
    }
    function stopGif() {
      clearInterval(gifTimer);
      gifTimer = null;
    }

    // l'image est reconnue / perdue : on lance / on arrête le GIF
    marker.addEventListener('markerFound', function () {
      if (loader) loader.style.display = 'none';
      statusEl.textContent = "Image détectée ✓";
      startGif();
    });
    marker.addEventListener('markerLost', function () {
      statusEl.textContent = "Pointe la caméra vers la photo";
      stopGif();
    });
  </script>
</body>
</html>
