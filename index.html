<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TD7 - AR.js image tracking</title>

<!-- A-Frame puis AR.js (image tracking / NFT) -->
<script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1c2407b26c61958baa93967b5412487cd94b290b/dist/aframe-master.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

<style>
  .arjs-loader {
    height: 100%;
    width: 100%;
    position: absolute;
    top: 0;
    left: 0;
    background-color: rgba(0, 0, 0, 0.8);
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .arjs-loader div {
    text-align: center;
    font-size: 1.25em;
    color: white;
  }
  /* bandeau d'état : permet de voir ce qui se passe sur le téléphone */
  #status {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: 10px;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    font-family: sans-serif;
    font-size: 16px;
    text-align: center;
    z-index: 10000;
  }
  /* zone de diagnostic : messages d'erreur lisibles sur le téléphone */
  #debug {
    position: fixed;
    top: 52px;
    left: 0;
    right: 0;
    max-height: 40vh;
    overflow: auto;
    margin: 0;
    padding: 6px 10px;
    background: rgba(0, 0, 0, 0.65);
    color: #7CFC7C;
    font-family: monospace;
    font-size: 11px;
    white-space: pre-wrap;
    z-index: 10000;
  }
</style>
</head>

<body style="margin: 0px; overflow: hidden;">

  <div id="status">Chargement… autorise la caméra</div>
  <pre id="debug"></pre>

  <div class="arjs-loader">
    <div>Loading, please wait...</div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >

    <!-- l'image qui sert de déclencheur : descripteurs assets/a.iset, a.fset, a.fset3 -->
    <a-nft
      id="marker"
      type="nft"
      url="assets/a"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <!-- la photo apparaît au-dessus de l'image, flotte, tourne, pulse et change de teinte -->
      <!-- position = x y z à partir du coin bas-gauche de l'image ; width/height = taille -->
      <a-image
        src="assets/photo.jpg"
        width="400"
        height="300"
        position="361 271 40"
        animation__float="property: position; from: 361 271 40; to: 361 271 140; dir: alternate; dur: 1500; loop: true; easing: easeInOutSine"
        animation__spin="property: rotation; from: 0 0 0; to: 0 0 360; dur: 8000; loop: true; easing: linear"
        animation__pulse="property: scale; from: 1 1 1; to: 1.2 1.2 1.2; dir: alternate; dur: 1000; loop: true; easing: easeInOutSine"
        animation__color="property: components.material.material.color; type: color; from: #ffffff; to: #ffd400; dir: alternate; dur: 1500; loop: true"
      ></a-image>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    var statusEl = document.getElementById('status');
    var dbg = document.getElementById('debug');
    function log(m) { dbg.textContent += m + "\n"; }

    // chronomètre pendant le chargement
    var t0 = Date.now(), loaded = false;
    var timer = setInterval(function () {
      if (loaded) { clearInterval(timer); return; }
      statusEl.textContent = "Chargement… " + Math.round((Date.now() - t0) / 1000) + " s";
    }, 1000);

    // vérifie que GitHub Pages sert bien les 3 fichiers de la photo
    ['iset', 'fset', 'fset3'].forEach(function (ext) {
      fetch('assets/a.' + ext).then(function (r) {
        return r.arrayBuffer().then(function (b) {
          log('a.' + ext + ' : HTTP ' + r.status + ' (' + Math.round(b.byteLength / 1024) + ' Ko)');
        });
      }).catch(function (e) { log('a.' + ext + ' : ERREUR ' + e); });
    });

    // affiche les erreurs dans la zone de diagnostic
    var _log = console.log, _err = console.error;
    console.log = function () {
      var m = Array.prototype.slice.call(arguments).join(' ');
      if (/error|erreur|fail/i.test(m)) log('LOG: ' + m.slice(0, 200));
      _log.apply(console, arguments);
    };
    console.error = function () {
      log('ERR: ' + Array.prototype.slice.call(arguments).join(' ').slice(0, 200));
      _err.apply(console, arguments);
    };
    window.addEventListener('error', function (e) { log('ERR: ' + e.message); });
    window.addEventListener('unhandledrejection', function (e) {
      log('PROMISE: ' + ((e.reason && e.reason.message) || e.reason));
    });
    var loader = document.querySelector('.arjs-loader');
    var marker = document.getElementById('marker');

    // les descripteurs de l'image sont chargés
    window.addEventListener('arjs-nft-loaded', function () {
      loaded = true;
      log('arjs-nft-loaded OK après ' + Math.round((Date.now() - t0) / 1000) + ' s');
      if (loader) loader.style.display = 'none';
      statusEl.textContent = "Pointe la caméra vers la photo";
    });

    // l'image est reconnue / perdue
    marker.addEventListener('markerFound', function () {
      if (loader) loader.style.display = 'none';
      statusEl.textContent = "Image détectée ✓";
    });
    marker.addEventListener('markerLost', function () {
      statusEl.textContent = "Pointe la caméra vers la photo";
    });
  </script>
</body>
</html>
