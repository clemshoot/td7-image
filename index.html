<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TD7 - AR.js image tracking</title>

<!-- A-Frame puis AR.js (image tracking / NFT) -->
<script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1c2407b26c61958baa93967b5412487cd94b290b/dist/aframe-master.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

<style>
  .arjs-loader {
    height: 100%;
    width: 100%;
    position: absolute;
    top: 0;
    left: 0;
    background-color: rgba(0, 0, 0, 0.8);
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .arjs-loader div {
    text-align: center;
    font-size: 1.25em;
    color: white;
  }
  /* bandeau d'état : permet de voir ce qui se passe sur le téléphone */
  #status {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: 10px;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    font-family: sans-serif;
    font-size: 16px;
    text-align: center;
    z-index: 10000;
  }
</style>
</head>

<body style="margin: 0px; overflow: hidden;">

  <div id="status">Chargement… autorise la caméra</div>

  <div class="arjs-loader">
    <div>Loading, please wait...</div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >

    <!-- l'image qui sert de déclencheur : descripteurs assets/a.iset, a.fset, a.fset3 -->
    <a-nft
      id="marker"
      type="nft"
      url="assets/a"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <!-- la photo apparaît au-dessus de l'image, flotte, tourne, pulse et change de teinte -->
      <!-- position = x y z à partir du coin bas-gauche de l'image ; width/height = taille -->
      <a-image
        src="assets/photo.jpg"
        width="400"
        height="300"
        position="361 271 40"
        animation__float="property: position; from: 361 271 40; to: 361 271 140; dir: alternate; dur: 1500; loop: true; easing: easeInOutSine"
        animation__spin="property: rotation; from: 0 0 0; to: 0 0 360; dur: 8000; loop: true; easing: linear"
        animation__pulse="property: scale; from: 1 1 1; to: 1.2 1.2 1.2; dir: alternate; dur: 1000; loop: true; easing: easeInOutSine"
        animation__color="property: components.material.material.color; type: color; from: #ffffff; to: #ffd400; dir: alternate; dur: 1500; loop: true"
      ></a-image>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    var status = document.getElementById('status');
    var loader = document.querySelector('.arjs-loader');
    var marker = document.getElementById('marker');

    // les descripteurs de l'image sont chargés
    window.addEventListener('arjs-nft-loaded', function () {
      if (loader) loader.style.display = 'none';
      status.textContent = "Pointe la caméra vers la photo";
    });

    // l'image est reconnue / perdue
    marker.addEventListener('markerFound', function () {
      if (loader) loader.style.display = 'none';
      status.textContent = "Image détectée ✓";
    });
    marker.addEventListener('markerLost', function () {
      status.textContent = "Pointe la caméra vers la photo";
    });
  </script>
</body>
</html>
